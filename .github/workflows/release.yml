name: Release gem

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  push:
    if: github.repository == 'eval/bonchi'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      # Set up
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            index.rubygems.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
          ruby-version: ruby

      # Read version from version.rb
      - name: Get version
        id: version
        run: |
          version=$(ruby -r ./lib/bonchi/version -e 'puts Bonchi::VERSION')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Release
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1

      # Job Summary
      - name: Summary
        run: |
          version="${{ steps.version.outputs.version }}"
          version_anchor="${version//./}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 🌳 Bonchi ${version}

          - **RubyGems**: https://rubygems.org/gems/bonchi/versions/${version}
          - **Changelog**: https://github.com/eval/bonchi/blob/main/CHANGELOG.md#${version_anchor}
          - **Attestation**: \`gem fetch bonchi -v ${version} && gh attestation verify bonchi-${version}.gem --owner eval\`
          EOF

      # GH Attestations
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pkg/*.gem

      # GH Release
      - name: Create GitHub release
        run: |
          version="${{ steps.version.outputs.version }}"
          dot_count=$(echo "$version" | tr -cd '.' | wc -c)

          read -r -d '' notes <<EOF || true
          ## ✨ Bonchi ${version} 🌳
          A git worktree manager.

          **Rubygems**: https://rubygems.org/gems/bonchi/versions/${version}
          **Changelog**: https://github.com/eval/bonchi/blob/main/CHANGELOG.md#${version//./}
          EOF

          if [[ "$dot_count" -gt 2 ]]; then
            gh release create "$version" --prerelease --generate-notes
          else
            gh release create "$version" --generate-notes --notes "$notes"
          fi

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
